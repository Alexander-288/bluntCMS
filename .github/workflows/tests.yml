name: Tests

on:
  push:
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint PHP
        run: for f in blunt/*.php blunt/lib/*.php tests/*.php; do php -l "$f" > /dev/null || exit 1; done
      - name: Run tests
        run: php tests/run.php

  js:
    name: Editor JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax
        run: for f in blunt/js/*.js; do node --check "$f" || exit 1; done
