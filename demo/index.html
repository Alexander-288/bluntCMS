<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blunt Demo</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <div class="wrap">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
    </nav>

    <header class="hero">
      <h1 data-blunt="hero-title">Say it bluntly.</h1>
      <p data-blunt="hero-text">This page is plain HTML. Log in to BluntCMS and edit it right here.</p>
      <a class="button" data-blunt="hero-cta" href="about.html">Read more</a>
    </header>

    <section class="cards">
      <article class="card">
        <h2 data-blunt="card-1-title">Text</h2>
        <p data-blunt="card-1-text">Pick the pencil and click any outlined block to type.</p>
      </article>
      <article class="card">
        <h2 data-blunt="card-2-title">Shape</h2>
        <p data-blunt="card-2-text">Pick the arrow, click a card, and drag its corner dots.</p>
      </article>
      <article class="card">
        <h2 data-blunt="card-3-title">Rich text</h2>
        <p data-blunt="card-3-text">This block has <strong>bold</strong> text, so Light won't edit it.</p>
      </article>
    </section>
  </div>
</body>
</html>
